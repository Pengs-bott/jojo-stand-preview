const copy = value => structuredClone(value);
const find = (list, id, kind) => {
  const item = list.find(entry => entry.id === id);
  if (!item) throw new Error(`${kind}을 찾을 수 없습니다: ${id}`);
  return item;
};
const getAbility = (catalog, id) => find(catalog.abilities, id, '능력');
const getBodies = (catalog, abilityId) => getAbility(catalog, abilityId).bodyIds.map(id => find(catalog.bodies, id, '몸체'));
const getUsages = (catalog, abilityId, bodyId) => {
  const ability = getAbility(catalog, abilityId);
  if (!ability.bodyIds.includes(bodyId)) throw new Error('이 능력과 호환되지 않는 몸체입니다.');
  const body = find(catalog.bodies, bodyId, '몸체');
  return body.usageIds.map(id => find(catalog.usages, id, '사용법'));
};
const renderText = (text, context) => text.replace(/\{\{([\w.]+)\}\}/g, (_, path) => {
  const parts = path.split('.');
  let value = context;
  for (const part of parts) {
    if (!value || !Object.hasOwn(value, part)) throw new Error(`누락된 규칙 데이터: ${path}`);
    value = value[part];
  }
  if (typeof value !== 'string' && typeof value !== 'number') throw new Error(`문자열 규칙 데이터가 아닙니다: ${path}`);
  return String(value);
});

/** Field replacement, never concatenating two independent operating modes. */
function composeStand(catalog, selection) {
  const ability = getAbility(catalog, selection.abilityId);
  const body = getBodies(catalog, ability.id).find(entry => entry.id === selection.bodyId);
  if (!body) throw new Error('이 능력과 호환되지 않는 몸체입니다.');
  const usage = getUsages(catalog, ability.id, body.id).find(entry => entry.id === selection.usageId);
  if (!usage || !usage.bodyIds.includes(body.id)) throw new Error('이 몸체와 호환되지 않는 사용법입니다.');
  const defaultBody = find(catalog.bodies, ability.defaultBodyId, '기본 몸체');
  const rules = { ...ability.rules, ...body.ruleOverrides, ...usage.ruleOverrides };
  const context = { ability, body, usage };
  for (const field of RULE_FIELDS) {
    if (typeof rules[field] !== 'string' || !rules[field].trim()) throw new Error(`필수 규칙 누락: ${field}`);
    rules[field] = renderText(rules[field], context);
  }
  // The exported result contains common termination too, not just a reference.
  rules.termination += ` ${catalog.commonRules[0]}`;
  const capabilityNames = ids => ids.map(id => catalog.capabilities[id]);
  const added = body.capabilities.filter(id => !defaultBody.capabilities.includes(id));
  const removed = defaultBody.capabilities.filter(id => !body.capabilities.includes(id));
  return {
    schemaVersion: catalog.schemaVersion,
    selection: { abilityId: ability.id, bodyId: body.id, usageId: usage.id },
    ability: { id: ability.id, name: ability.name, tag: ability.tag, symbol: ability.symbol },
    body: { id: body.id, name: body.name, form: body.form, formName: catalog.forms[body.form], appearance: body.appearance, activityRange: body.activityRange, delivery: body.delivery, capabilities: copy(body.capabilities), actions: capabilityNames(body.capabilities), limitations: copy(body.limitations), operationRelations: copy(body.operationRelations) },
    usage: { id: usage.id, name: body.usageLabels?.[usage.id] ?? usage.name, gained: copy(usage.gained), lost: copy(usage.lost) },
    summary: renderText(usage.summary, context),
    rules,
    commonRules: copy(catalog.commonRules),
    parameters: { ...copy(ability.parameters), ...copy(body.parameterOverrides), ...copy(usage.parameterOverrides) },
    stats: copy(catalog.statsProfiles[body.statsProfile]),
    statsLabels: copy(catalog.statsLabels),
    addedBodyActions: capabilityNames(added),
    lostBodyActions: capabilityNames(removed),
    notGranted: [...copy(body.limitations), ...copy(usage.lost)],
    examples: copy(usage.examples ?? ability.examples),
    caution: usage.caution ?? ability.caution,
    economy: copy(ability.economy),
  };
}

function validateCatalog(catalog) {
  if (catalog.schemaVersion !== 1) throw new Error('지원하지 않는 데이터 버전입니다.');
  for (const key of ['abilities', 'bodies', 'usages']) {
    if (!Array.isArray(catalog[key])) throw new Error(`목록 누락: ${key}`);
    const ids = catalog[key].map(entry => entry.id);
    if (new Set(ids).size !== ids.length || ids.some(id => typeof id !== 'string' || !id)) throw new Error(`중복되거나 잘못된 ID: ${key}`);
  }
  if (!Array.isArray(catalog.commonRules) || !catalog.commonRules[0]) throw new Error('공통 규칙이 없습니다.');
  for (const ability of catalog.abilities) {
    for (const field of RULE_FIELDS) if (!ability.rules[field]) throw new Error(`필수 규칙 누락: ${ability.id}/${field}`);
    if (!ability.bodyIds.includes(ability.defaultBodyId)) throw new Error('기본 몸체가 허용 목록에 없습니다.');
    const bodies = getBodies(catalog, ability.id);
    if (new Set(ability.bodyIds).size !== ability.bodyIds.length || new Set(ability.usageIds).size !== ability.usageIds.length) throw new Error('중복된 호환 관계입니다.');
    for (const body of bodies) {
      if (body.abilityId !== ability.id || !catalog.forms[body.form]) throw new Error('몸체 소유 관계 또는 외형 분류가 잘못됐습니다.');
      if (!Array.isArray(body.capabilities) || body.capabilities.some(id => !catalog.capabilities[id])) throw new Error('명시되지 않은 몸체 기능입니다.');
      const stats = catalog.statsProfiles[body.statsProfile];
      if (!stats || stats.length !== 6 || stats.some(value => !['A','B','C','D','E'].includes(value))) throw new Error('몸체 능력치가 잘못됐습니다.');
      if (!body.usageIds.length || !body.usageIds.includes(body.defaultUsageId)) throw new Error('기본 사용법이 없습니다.');
      for (const id of body.usageIds) {
        if (!ability.usageIds.includes(id)) throw new Error('능력에 등록되지 않은 사용법입니다.');
        const usage = find(catalog.usages, id, '사용법');
        if (usage.abilityId !== ability.id || !usage.bodyIds.includes(body.id)) throw new Error('사용법 호환 관계가 일치하지 않습니다.');
        for (const patch of [body.ruleOverrides, usage.ruleOverrides]) {
          if (Object.keys(patch).some(key => !RULE_FIELDS.includes(key))) throw new Error('알 수 없는 규칙 대체 항목입니다.');
        }
        composeStand(catalog, { abilityId: ability.id, bodyId: body.id, usageId: id });
      }
    }
    composeStand(catalog, { abilityId: ability.id, bodyId: ability.defaultBodyId, usageId: ability.defaultUsageId });
  }
  // Reject unused or one-way relations rather than silently hiding data errors.
  for (const body of catalog.bodies) if (!getAbility(catalog, body.abilityId).bodyIds.includes(body.id)) throw new Error('등록되지 않은 몸체 관계입니다.');
  for (const usage of catalog.usages) {
    const ability = getAbility(catalog, usage.abilityId);
    if (!ability.usageIds.includes(usage.id) || !usage.bodyIds.length) throw new Error('등록되지 않은 사용법 관계입니다.');
    for (const id of usage.bodyIds) if (!getBodies(catalog, ability.id).find(body => body.id === id)?.usageIds.includes(usage.id)) throw new Error('사용법의 역방향 관계가 일치하지 않습니다.');
  }
  return true;
}

const initialState = () => ({ step: 'abilities', abilityId: null, bodyId: null, usageId: null, bodyConfirmed: false });
function selectAbility(catalog, state, abilityId, quick = false) {
  const ability = getAbility(catalog, abilityId);
  return { ...initialState(), step: quick ? 'result' : 'bodies', abilityId, bodyId: ability.defaultBodyId, usageId: ability.defaultUsageId, bodyConfirmed: quick };
}
function selectBody(catalog, state, bodyId) {
  const body = getBodies(catalog, state.abilityId).find(entry => entry.id === bodyId);
  if (!body) throw new Error('이 몸체는 호환되지 않습니다.');
  return { ...state, step: 'bodies', bodyId, usageId: body.defaultUsageId, bodyConfirmed: true };
}
function selectUsage(catalog, state, usageId) {
  if (!getUsages(catalog, state.abilityId, state.bodyId).some(usage => usage.id === usageId)) throw new Error('이 사용법은 호환되지 않습니다.');
  return { ...state, usageId };
}
function advance(catalog, state) {
  if (state.step === 'bodies') {
    if (!state.bodyConfirmed) throw new Error('몸체를 먼저 선택해 주세요.');
    return { ...state, step: getUsages(catalog, state.abilityId, state.bodyId).length > 1 ? 'usages' : 'result' };
  }
  if (state.step === 'usages') {
    composeStand(catalog, state);
    return { ...state, step: 'result' };
  }
  return state;
}
function goBack(catalog, state) {
  if (state.step === 'result') return { ...state, step: getUsages(catalog, state.abilityId, state.bodyId).length > 1 ? 'usages' : 'bodies' };
  if (state.step === 'usages') return { ...state, step: 'bodies' };
  if (state.step === 'bodies') return { ...state, step: 'abilities' };
  return state;
}

  const labels = ['효과','대상','발동','범위','지속','종료','제약'];

}

const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bullets = items => `<ul class="list">${items.map(item => `<li>${escape(item)}</li>`).join('')}</ul>`;
const button = (action, label, extra = '') => `<button type="button" class="btn ${extra}" data-action="${action}">${label}</button>`;
const labels = ['효과','대상','발동','범위','지속','종료','제약'];

function mountCreator(root, catalog = CATALOG) {
  validateCatalog(catalog);
  let state = initialState();
  let selectionNotice = '';
  const rulesMarkup = rules => `<dl class="rules">${RULE_FIELDS.map((key,i) => `<dt>${labels[i]}</dt><dd>${escape(rules[key])}</dd>`).join('')}</dl>`;
  const selectedResult = () => composeStand(catalog, state);
  const bodyCopy = body => DISPLAY.bodies[body.id] || {note: '', limit: body.limitations[0] || ''};
  const abilityLimits = (ability, result) => {
    const usage = catalog.usages.find(item => item.id === result.selection.usageId);
    // A mode-specific caution replaces the base caution, just as in core composition.
    return usage.caution ? [usage.caution] : (DISPLAY.abilities[ability.id]?.limits || [ability.caution]);
  };
  const usageCopy = (usage, result) => DISPLAY.usages[usage.id] || {effect:result.summary,gain:usage.gained.join(' · '),loss:usage.lost.join(' · ')};
  const nav = () => `<ol class="steps" aria-label="제작 순서">${[['abilities','능력'],['bodies','몸체'],['usages','사용법'],['result','완성']].map(([key,label],i) => `<li class="${state.step===key?'current':''}" ${state.step===key?'aria-current="step"':''}><span>${i+1}</span>${label}</li>`).join('')}</ol>`;
  const toolbar = label => `<div class="head-row"><h1 tabindex="-1">${label}</h1>${state.step==='abilities'?'':button('reset','처음부터','quiet')}</div>`;
  const bodyDetails = result => `<p>${escape(result.body.appearance)}</p><h3>실제 행동</h3>${bullets(result.body.actions)}<p><strong>발동·전달</strong><br>${escape(result.body.delivery)}</p><p><strong>몸체 활동 범위</strong><br>${escape(result.body.activityRange)}</p><h3>포함되지 않는 기능</h3>${bullets(result.body.limitations)}${result.lostBodyActions.length?`<p>추천 몸체에서 포기: ${escape(result.lostBodyActions.join(' · '))}</p>`:''}${result.addedBodyActions.length?`<p>추천 몸체와 달리 가능: ${escape(result.addedBodyActions.join(' · '))}</p>`:''}`;
  const choiceBar = (backLabel, nextLabel, disabled = false, note = '') => `<div class="choice-bar"><p class="choice-status" role="status">${escape(note)}</p><div class="choice-buttons">${button('back',backLabel,'quiet')}<button type="button" class="btn primary" data-action="advance" ${disabled?'disabled':''}>${escape(nextLabel)}</button></div></div>`;
  function abilityPage() {
    return `${toolbar('어떤 능력으로 시작할까요?')}<p class="intro">능력 하나로 바로 완성하거나, 몸체와 사용법을 바꿔 보세요.</p><div class="grid">${catalog.abilities.map(ability => {
      const body = getBodies(catalog, ability.id).find(body => body.id === ability.defaultBodyId);
      const result = composeStand(catalog,{abilityId:ability.id,bodyId:body.id,usageId:ability.defaultUsageId});
      return `<article class="card" data-ability="${escape(ability.id)}"><div class="card-top"><span class="symbol" aria-hidden="true">${escape(ability.symbol)}</span><span class="tag">${escape(ability.tag)}</span></div><h2>${escape(ability.name)}</h2><p class="effect">${escape(ability.description)}</p><p class="example"><span>활용</span> ${escape(ability.examples[0])}</p><div class="caution">${bullets(abilityLimits(ability,result))}</div><p class="defaults">추천: ${escape(body.name)} · ${escape(catalog.forms[body.form])}</p><div class="card-actions"><button type="button" class="btn primary" data-action="ability" data-id="${escape(ability.id)}" aria-label="${escape(ability.name)} 몸체 고르기">몸체 고르기</button><button type="button" class="btn quiet" data-action="quick" data-id="${escape(ability.id)}" aria-label="${escape(ability.name)} 추천으로 바로 완성">바로 완성</button></div><details><summary>추천형 상세 규칙</summary>${rulesMarkup(result.rules)}${bodyDetails(result)}${bullets(result.commonRules)}</details></article>`;
    }).join('')}</div>`;
  }
  function bodyPage() {
    const ability = getAbility(catalog,state.abilityId);
    const result = selectedResult();
    return `${toolbar('어떤 몸체로 사용할까요?')}<p class="intro"><strong>${escape(ability.name)}</strong>은 그대로. 이동과 손작업이 달라집니다.</p><div class="grid body-grid">${getBodies(catalog,ability.id).map(body => {
      const preview = composeStand(catalog,{abilityId:ability.id,bodyId:body.id,usageId:body.defaultUsageId});
      const copy = bodyCopy(body);
      const chosen=state.bodyConfirmed&&state.bodyId===body.id;
      return `<article class="card body-card ${chosen?'selected':''}"><span class="badge">${escape(catalog.forms[body.form])}${body.id===ability.defaultBodyId?' · 추천':''}</span><h2>${escape(body.name)}</h2><p>${escape(copy.appearance || body.appearance)}</p><p class="difference">${escape(copy.note || preview.body.actions.join(' · '))}</p><p class="small range-label">몸체 활동: ${escape(body.activityRange)}</p><p class="body-limit">${escape(copy.limit)}</p><button type="button" class="btn ${chosen?'primary':'quiet'}" aria-pressed="${chosen}" data-action="body" data-id="${escape(body.id)}">${chosen?'선택됨':'이 몸체 선택'}</button><details><summary>몸체 기능 전체 보기</summary>${bodyDetails(preview)}</details></article>`;
    }).join('')}</div>${selectionNotice?`<p class="notice" role="status">${escape(selectionNotice)}</p>`:''}<p class="small">몸체를 바꾸면 그 몸체의 기본 사용법이 적용됩니다.</p>${choiceBar('능력으로',getUsages(catalog,state.abilityId,state.bodyId).length===1?'이 몸체로 완성':'사용법 고르기',!state.bodyConfirmed,state.bodyConfirmed?`선택: ${result.body.name}`:'추천 몸체도 눌러 선택해 주세요.')}`;
  }
  function usagePage() {
    const body = selectedResult().body;
    return `${toolbar('같은 능력, 어떻게 쓸까요?')}<p class="intro"><strong>${escape(getAbility(catalog,state.abilityId).name)} · ${escape(body.name)}</strong><br>한 가지 운용만 선택합니다. 두 사용법을 합치지 않습니다.</p><div class="grid">${getUsages(catalog,state.abilityId,state.bodyId).map(usage => {
      const result=composeStand(catalog,{abilityId:state.abilityId,bodyId:state.bodyId,usageId:usage.id});
      const copy=usageCopy(usage,result);
      const chosen=state.usageId===usage.id;
      return `<article class="card usage-card ${chosen?'selected':''}"><span class="badge">${usage.id===getBodies(catalog,state.abilityId).find(body=>body.id===state.bodyId).defaultUsageId?'기본 사용법':'운용 변경'}</span><h2>${escape(result.usage.name)}</h2><p class="effect">${escape(copy.effect)}</p><p class="trade"><strong>가능</strong> ${escape(copy.gain)}</p>${copy.loss?`<p class="trade"><strong>포기</strong> ${escape(copy.loss)}</p>`:''}${copy.limit?`<p class="body-limit">${escape(copy.limit)}</p>`:''}<button type="button" class="btn ${chosen?'primary':'quiet'}" aria-pressed="${chosen}" data-action="usage" data-id="${escape(usage.id)}">${chosen?'선택됨':'이 사용법 선택'}</button><details><summary>이 운용의 상세 규칙</summary>${rulesMarkup(result.rules)}<h3>가능한 것</h3>${bullets(usage.gained)}<h3>포기하는 것</h3>${bullets(usage.lost)}</details></article>`;
    }).join('')}</div>${choiceBar('몸체로','이 사용법으로 완성',false,`선택: ${selectedResult().usage.name}`)}`;
  }
  function resultPage() {
    const result=selectedResult();
    const ability=getAbility(catalog,state.abilityId);
    const usage=catalog.usages.find(item=>item.id===state.usageId);
    const copy=usageCopy(usage,result);
    const body=bodyCopy(result.body);
    const important=[...abilityLimits(ability,result),body.limit];
    if(copy.limit) important.push(copy.limit);
    if(copy.loss&&usage.id!==getBodies(catalog,state.abilityId).find(item=>item.id===state.bodyId).defaultUsageId) important.push(copy.loss);
    return `<div class="result-head"><span class="tag">나만의 스탠드 · 완성</span><h1 tabindex="-1">${escape(result.ability.name)}</h1><p class="result-identity">${escape(result.body.name)} · ${escape(result.body.formName)}</p><span class="badge">${escape(result.usage.name)}</span><p class="effect">${escape(result.summary)}</p></div><section class="panel result-summary"><h2>내 스탠드로 할 수 있는 일</h2><p>${escape(body.note || result.body.actions.join(' · '))}</p><p class="example"><span>활용</span> ${escape(result.examples[0])}</p><div class="caution"><strong>꼭 알아둘 것</strong>${bullets([...new Set(important.filter(Boolean))])}</div></section><div class="result-actions">${button('edit-body','몸체 바꾸기','primary')}${getUsages(catalog,state.abilityId,state.bodyId).length>1?button('edit-usage','사용법 바꾸기','quiet'):''}${button('back','이전 단계','quiet')}${button('reset','다시 제작','quiet')}</div><section class="panel full-details"><h2>필요할 때 자세히 보기</h2><details data-detail="rules"><summary>능력의 전체 규칙 · 7항목</summary>${rulesMarkup(result.rules)}</details><details data-detail="body"><summary>몸체 기능·활동 범위·선택의 차이</summary>${bodyDetails(result)}<h3>선택한 사용법</h3><p>${escape(result.summary)}</p>${bullets(result.usage.gained)}<h3>이 사용법에서 포기하는 것</h3>${bullets(result.usage.lost)}<h3>활용 사례 더 보기</h3>${bullets(result.examples)}</details><details data-detail="stats"><summary>몸체의 능력치</summary><div class="stats">${result.stats.map((value,i)=>`<div class="stat"><span>${escape(result.statsLabels[i])}</span><strong>${escape(value)}</strong></div>`).join('')}</div><p class="small">이미 가진 행동의 성능입니다. 능력의 명시된 거리·시간·개수는 바뀌지 않습니다. 착용형·도구형의 등급이 사용자 신체를 강화하지 않습니다.</p></details><details data-detail="common"><summary>공통 종료·예외 규칙</summary>${bullets(result.commonRules)}</details><details data-detail="copy"><summary>전체 결과 원고 복사</summary><label class="small" for="result-copy">선택한 행동과 전체 규칙</label><textarea id="result-copy" class="copy-area" readonly>${escape(resultText(result))}</textarea>${button('copy','원고 복사','quiet')}<p id="copy-status" class="small" role="status"></p></details></section>`;
  }
  function render(focus=true) {
    root.classList.toggle('has-choice-bar',['bodies','usages'].includes(state.step));
    root.innerHTML=nav()+({abilities:abilityPage,bodies:bodyPage,usages:usagePage,result:resultPage}[state.step]());
    if(focus) { root.querySelector('h1')?.focus({preventScroll:true}); window.scrollTo({top:0,behavior:'auto'}); }
  }
  const onClick=async event=> {
    const target=event.target.closest('button[data-action]');
    if(!target||!root.contains(target)) return;
    const action=target.dataset.action;
    try {
      if(action==='copy') {
        const area=root.querySelector('#result-copy');
        area.focus(); area.select();
        if(navigator.clipboard?.writeText) {
          try { await navigator.clipboard.writeText(area.value); root.querySelector('#copy-status').textContent='완성 원고를 복사했습니다.'; }
          catch { root.querySelector('#copy-status').textContent='원고가 선택되었습니다. 복사 명령으로 가져가세요.'; }
        } else root.querySelector('#copy-status').textContent='원고가 선택되었습니다. 복사 명령으로 가져가세요.';
        return;
      }
      selectionNotice='';
      if(action==='ability'||action==='quick') state=selectAbility(catalog,state,target.dataset.id,action==='quick');
      else if(action==='body') {
        const previousUsage=state.usageId;
        state=selectBody(catalog,state,target.dataset.id);
        if(previousUsage!==state.usageId) selectionNotice=`몸체를 바꾸면서 사용법이 ‘${selectedResult().usage.name}’으로 바뀌었습니다. 다음 단계에서 호환되는 운용을 고를 수 있습니다.`;
      }
      else if(action==='usage') state=selectUsage(catalog,state,target.dataset.id);
      else if(action==='advance') state=advance(catalog,state);
      else if(action==='back') state=goBack(catalog,state);
      else if(action==='reset') state=initialState();
      else if(action==='edit-body') state={...state,step:'bodies'};
      else if(action==='edit-usage') state={...state,step:'usages'};
      render(!['body','usage'].includes(action));
      if(['body','usage'].includes(action)) [...root.querySelectorAll('button[data-action]')].find(node=>node.dataset.action===action && node.dataset.id===target.dataset.id)?.focus({preventScroll:true});
    } catch(error) {
      const message=document.createElement('p'); message.className='error'; message.setAttribute('role','alert'); message.textContent=error.message; root.prepend(message);
    }
  };
  root.addEventListener('click',onClick);
  render(false);
  return { getState:()=>structuredClone(state), getResult:()=>state.abilityId?selectedResult():null, destroy:()=>root.removeEventListener('click',onClick) };
}

let activeCreator = null;
if (typeof document !== 'undefined') {
  const root=document.getElementById('app');
  if(root) {
    try { activeCreator = mountCreator(root); }
    catch(error) { root.textContent=`제작 데이터를 읽지 못했습니다: ${error.message}`; root.setAttribute('role','alert'); }
  }
}

</script>
